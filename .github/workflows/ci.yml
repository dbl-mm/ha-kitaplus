name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.13 && uv pip install pytest-homeassistant-custom-component aioresponses ruff
      - run: .venv/bin/ruff check custom_components tests scripts
      - run: .venv/bin/ruff format --check custom_components tests scripts
      - run: .venv/bin/python -m pytest -q
