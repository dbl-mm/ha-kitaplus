name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  # A newer push replaces a run that is still going for the same branch, so nothing is computed twice.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv venv --python 3.13 && uv pip install pytest-homeassistant-custom-component aioresponses pytest-cov mypy ruff bandit
      - name: Lint
        run: |
          .venv/bin/ruff check custom_components tests scripts
          .venv/bin/ruff format --check custom_components tests scripts
      - name: Strict typing (Platinum rule strict-typing)
        run: .venv/bin/mypy --strict custom_components/kitaplus
      - name: Security scan
        run: .venv/bin/bandit -q -r custom_components -ll
      - name: Tests with coverage (Silver rule test-coverage, at least 95 percent per module)
        run: |
          .venv/bin/python -m pytest -q --cov=custom_components.kitaplus --cov-report=json --cov-report=term-missing
          .venv/bin/python scripts/check_coverage.py 95
