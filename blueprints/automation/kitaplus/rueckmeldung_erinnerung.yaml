blueprint:
  name: "KitaPlus: Erinnerung an offene Rückmeldungen"
  description: |
    Erinnert an Nachrichten der Kita, die du **bestätigen oder beantworten** musst (zum Beispiel Einwilligungen oder
    Umfragen), mit Titel und Frist. Meldet sofort, wenn eine neue Rückmeldung nötig wird, und auf Wunsch jeden Tag erneut.
    *(English: reminds you of messages that still need your confirmation, with the deadline.)*

    In der Aktion stehen `count`, `titles` (Liste der Titel) und `message` zur Verfügung.
  domain: automation
  author: dbl-mm
  source_url: https://github.com/dbl-mm/ha-kitaplus/blob/main/blueprints/automation/kitaplus/rueckmeldung_erinnerung.yaml
  homeassistant:
    min_version: 2025.8.0
  input:
    pending:
      name: Sensor „Offene Rückmeldungen“
      selector:
        entity:
          filter:
            - integration: kitaplus
              domain: sensor
    notify_action:
      name: Was soll passieren?
      description: Standard ist eine Mitteilung über `notify.notify`.
      default:
        - action: notify.notify
          data:
            title: Kita
            message: "{{ message }}"
      selector:
        action:
    advanced:
      name: Erweitert
      icon: mdi:cog
      collapsed: true
      input:
        remind_daily:
          name: Jeden Tag erinnern, solange etwas offen ist
          default: true
          selector:
            boolean:
        remind_time:
          name: Uhrzeit der täglichen Erinnerung
          default: "17:00:00"
          selector:
            time:

mode: single
max_exceeded: silent

variables:
  pending: !input pending
  remind_daily: !input remind_daily
  count: "{{ states(pending) | int(0) }}"
  items: "{{ state_attr(pending, 'messages') or [] }}"
  titles: "{{ items | map(attribute='titel') | select('string') | list }}"
  message: >-
    {{ count }} {{ 'Rückmeldung ist' if count == 1 else 'Rückmeldungen sind' }} offen:
    {%- for m in items %} {{ m.titel }}{% if m.frist %} (bis {{ m.frist[8:10] }}.{{ m.frist[5:7] }}.){% endif %}{{ ',' if not loop.last }}{% endfor %}

triggers:
  - trigger: numeric_state
    entity_id: !input pending
    above: 0
    id: new
  - trigger: time
    at: !input remind_time
    id: daily

conditions:
  - condition: numeric_state
    entity_id: !input pending
    above: 0
  - condition: or
    alias: Sofort bei neuer Rückmeldung, die tägliche Erinnerung nur auf Wunsch
    conditions:
      - condition: trigger
        id: new
      - condition: template
        value_template: "{{ remind_daily }}"

actions:
  - alias: Deine Aktion
    sequence: !input notify_action
