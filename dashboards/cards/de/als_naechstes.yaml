# KitaPlus-Dashboard (Vorlage) · Version 0.4.0 · benötigt KitaPlus ab 0.3.1
type: markdown
content: |
  {%- set wd = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'] -%}
  {%- set mon = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'] -%}
  {%- macro clean(t) -%}
  {%- set s = (t or '') | regex_replace('[<>&"`*_#\\[\\]]', '') | regex_replace('[\n\r\t ]+', ' ') | trim -%}
  {%- for w in s.split(' ') -%}{{ w | truncate(24, True, '…') }}{{ ' ' if not loop.last }}{%- endfor -%}
  {%- endmacro -%}
  {%- macro dlabel(iso) -%}
  {%- set d = as_datetime(iso) -%}
  {%- if d -%}{{ wd[d.weekday()] }} {{ '%02d' | format(d.day) ~ '.' ~ '%02d' | format(d.month) ~ '.' }}{%- endif -%}
  {%- endmacro -%}

  ### <ha-icon icon="mdi:calendar"></ha-icon> Als Nächstes
  {% set entries = state_attr('sensor.kitaplus_nachste_termine', 'entries') or [] -%}
  {% if entries | count == 0 -%}
  Keine anstehenden Termine.
  {%- endif %}
  {% for e in entries[:3] %}
  {%- set head = clean(e.titel) | trim %}
  **{{ dlabel(e.datum) }}** · {{ (head if head else 'Ohne Titel') | truncate(80, True, '…') }}{% if e.zeit %} · {{ e.zeit }} Uhr{% endif %}{% if e.schliesstag %} · **Schließtag**{% endif %}

  {% endfor -%}
