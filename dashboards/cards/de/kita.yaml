# KitaPlus-Dashboard (Vorlage) · Version 0.4.0 · benötigt KitaPlus ab 0.3.1
type: markdown
content: |
  {%- set closed = [['binary_sensor.kitaplus_heute_geschlossen', 0, 'Kita heute'], ['binary_sensor.kitaplus_morgen_geschlossen', 1, 'Kita morgen']] -%}
  {%- for sensor, plus, label in closed -%}
  {%- set weekend = (now().weekday() + plus) % 7 >= 5 -%}
  {%- set reason = (state_attr(sensor, 'reason') or '') | string | trim -%}
  **{{ label }}** · {{ 'Geschlossen' if is_state(sensor, 'on') else ('Wochenende' if weekend else 'Geöffnet') }}{{ ' (' ~ reason ~ ')' if reason and is_state(sensor, 'on') else '' }}
  {% endfor %}
text_only: true
