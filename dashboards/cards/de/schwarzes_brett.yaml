# KitaPlus-Dashboard (Vorlage) · Version 0.3.5 · benötigt KitaPlus ab 0.3.1
type: markdown
content: |
  {%- set wd = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'] -%}
  {%- set mon = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'] -%}
  {%- macro clean(t) -%}
  {%- set s = (t or '') | regex_replace('[<>&"`*_#\\[\\]]', '') | regex_replace('[\n\r\t ]+', ' ') | trim -%}
  {%- for w in s.split(' ') -%}{{ w | truncate(24, True, '…') }}{{ ' ' if not loop.last }}{%- endfor -%}
  {%- endmacro -%}
  {%- macro dlabel(iso) -%}
  {%- set d = as_datetime(iso) -%}
  {%- if d -%}{{ wd[d.weekday()] }} {{ '%02d' | format(d.day) ~ '.' ~ '%02d' | format(d.month) ~ '.' }}{%- endif -%}
  {%- endmacro -%}

  ### <ha-icon icon="mdi:bulletin-board"></ha-icon> Schwarzes Brett
  {% set posts = state_attr('sensor.kitaplus_schwarzes_brett', 'posts') or [] -%}
  {% if posts | count == 0 -%}
  Kein Beitrag am Schwarzen Brett.
  {%- else -%}
  {%- set p = posts[0] -%}
  {%- set head = clean(p.titel) | trim -%}

  **{{ (head if head else 'Ohne Titel') | truncate(80, True, '…') }}**
  {% if p.datum %}
  {{ dlabel(p.datum) }}
  {% endif -%}
  {%- set body = clean(p.text) | trim -%}
  {% if body %}
  {{ body | truncate(100, True, '…') }}
  {% endif -%}{%- set files = (p.attachments or [])[:2] -%}
  {% if files %}
  Anhang: {% for f in files %}{% set label = clean(f.name) | trim | truncate(80, True, '…') %}{% if f.url and f.url.startswith('/api/kitaplus/') %}<a href="{{ f.url }}" target="_blank" rel="noopener">{{ label }}</a>{% else %}{{ label }}{% endif %}{{ ', ' if not loop.last }}{% endfor %}
  {% endif -%}
  {%- endif -%}
