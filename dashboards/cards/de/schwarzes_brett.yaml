# KitaPlus-Dashboard (Vorlage)
type: vertical-stack
cards:
- type: heading
  heading: Schwarzes Brett
  heading_style: title
  icon: mdi:bulletin-board
- type: markdown
  content: |-
    {% set items = state_attr('sensor.kitaplus_schwarzes_brett', 'posts') or [] %}
    {% if items | length == 0 %}
    _Keine Beiträge._
    {% else %}
    {% for p in items[:4] %}
    **{{ (p.titel or '–') | regex_replace('[*_`#>]', '') | trim }}**{% if p.datum %} · {{ p.datum[8:10] }}.{{ p.datum[5:7] }}.{{ p.datum[0:4] }}{% endif %}

    {% set text = (p.text or '') | regex_replace('[*_`#>]', '') | regex_replace('[\n\r\t ]+', ' ') | trim %}
    {% if text %}
    {{ text | truncate(110) }}

    {% endif %}
    {% endfor %}
    {% endif %}
