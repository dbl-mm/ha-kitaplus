# KitaPlus-Dashboard (Vorlage)
type: vertical-stack
cards:
- type: conditional
  conditions:
  - condition: state
    entity: sensor.kind_bestellstatus_heute
    state: open
  card:
    type: vertical-stack
    cards:
    - type: tile
      entity: sensor.kind_bestellstatus_heute
      name: Essen für heute noch bestellen
      icon: mdi:cart-arrow-down
      color: red
      state_content:
      - meal
    - type: tile
      entity: sensor.kind_nachste_bestellfrist
      name: Bestellfrist
      icon: mdi:timer-sand
      state_content:
      - state
- type: conditional
  conditions:
  - condition: state
    entity: sensor.kind_bestellstatus_morgen
    state: open
  card:
    type: vertical-stack
    cards:
    - type: tile
      entity: sensor.kind_bestellstatus_morgen
      name: Essen für morgen bestellen
      icon: mdi:cart-arrow-down
      color: red
      state_content:
      - meal
    - type: tile
      entity: sensor.kind_nachste_bestellfrist
      name: Bestellfrist
      icon: mdi:timer-sand
      state_content:
      - state
- type: conditional
  conditions:
  - condition: numeric_state
    entity: sensor.kitaplus_offene_ruckmeldungen
    above: 0
  card:
    type: vertical-stack
    cards:
    - type: tile
      entity: sensor.kitaplus_offene_ruckmeldungen
      name: Rückmeldungen offen
      icon: mdi:email-alert-outline
      color: orange
    - type: markdown
      content: |-
        {% for m in state_attr('sensor.kitaplus_offene_ruckmeldungen', 'messages') or [] %}
        - **{{ (m.titel or '–') | regex_replace('[*_`#>]', '') | trim }}**{% if m.frist %} · bis {{ m.frist[8:10] }}.{{ m.frist[5:7] }}.{% endif %}
        {% endfor %}
