# KitaPlus dashboard (template) · version 0.3.5 · needs KitaPlus 0.3.1 or newer
type: markdown
content: |
  {%- set wd = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'] -%}
  {%- set mon = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'] -%}
  {%- macro clean(t) -%}
  {%- set s = (t or '') | regex_replace('[<>&"`*_#\\[\\]]', '') | regex_replace('[\n\r\t ]+', ' ') | trim -%}
  {%- for w in s.split(' ') -%}{{ w | truncate(24, True, '…') }}{{ ' ' if not loop.last }}{%- endfor -%}
  {%- endmacro -%}
  {%- macro dlabel(iso) -%}
  {%- set d = as_datetime(iso) -%}
  {%- if d -%}{{ wd[d.weekday()] }} {{ d.day ~ ' ' ~ mon[d.month - 1] }}{%- endif -%}
  {%- endmacro -%}

  ### <ha-icon icon="mdi:bulletin-board"></ha-icon> Bulletin board
  {% set posts = state_attr('sensor.kitaplus_bulletin_board', 'posts') or [] -%}
  {% if posts | count == 0 -%}
  No post on the bulletin board.
  {%- else -%}
  {%- set p = posts[0] -%}
  {%- set head = clean(p.titel) | trim -%}

  **{{ (head if head else 'Untitled') | truncate(80, True, '…') }}**
  {% if p.datum %}
  {{ dlabel(p.datum) }}
  {% endif -%}
  {%- set body = clean(p.text) | trim -%}
  {% if body %}
  {{ body | truncate(100, True, '…') }}
  {% endif -%}{%- set files = (p.attachments or [])[:2] -%}
  {% if files %}
  Attachment: {% for f in files %}{% set label = clean(f.name) | trim | truncate(80, True, '…') %}{% if f.url and f.url.startswith('/api/kitaplus/') %}<a href="{{ f.url }}" target="_blank" rel="noopener">{{ label }}</a>{% else %}{{ label }}{% endif %}{{ ', ' if not loop.last }}{% endfor %}
  {% endif -%}
  {%- endif -%}
