# KitaPlus dashboard (template)
type: markdown
content: |
  {%- set wd = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'] -%}
  {%- set mon = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'] -%}
  {%- macro clean(t) -%}
  {%- set s = (t or '') | regex_replace('[<>&"`*_#\\[\\]]', '') | regex_replace('[\n\r\t ]+', ' ') | trim -%}
  {%- for w in s.split(' ') -%}{{ w | truncate(24, True, '…') }}{{ ' ' if not loop.last }}{%- endfor -%}
  {%- endmacro -%}
  {%- macro dlabel(iso) -%}
  {%- set d = as_datetime(iso) -%}
  {%- if d -%}{{ wd[d.weekday()] }} {{ d.day ~ ' ' ~ mon[d.month - 1] }}{%- endif -%}
  {%- endmacro -%}

  ### <ha-icon icon="mdi:calendar"></ha-icon> Coming up
  {% set entries = state_attr('sensor.kitaplus_upcoming_dates', 'entries') or [] -%}
  {% if entries | count == 0 -%}
  No upcoming dates.
  {%- endif %}
  {% for e in entries[:3] %}
  {%- set head = clean(e.titel) | trim %}
  **{{ dlabel(e.datum) }}** · {{ (head if head else 'Untitled') | truncate(80, True, '…') }}{% if e.zeit %} · {{ e.zeit }}{% endif %}{% if e.schliesstag %} · **Closure day**{% endif %}

  {% endfor -%}
