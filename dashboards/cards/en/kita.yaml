# KitaPlus dashboard (template) · version 0.5.0b1 · needs KitaPlus 0.5.0 or newer
type: grid
columns: 2
square: false
cards:
- type: tile
  entity: binary_sensor.kitaplus_closed_today
  name: Kita today
  icon: mdi:school-outline
  state_content:
  - state
  - reason
- type: tile
  entity: binary_sensor.kitaplus_closed_tomorrow
  name: Kita tomorrow
  icon: mdi:school-outline
  state_content:
  - state
  - reason
- type: tile
  entity: sensor.kind_opening_hours_today
  name: Opening hours today
  icon: mdi:clock-time-eight-outline
