# KitaPlus dashboard (template) · version 0.4.0 · needs KitaPlus 0.3.1 or newer
type: grid
columns: 2
square: false
cards:
- type: tile
  entity: binary_sensor.kitaplus_closed_today
  name: Kita today
  icon: mdi:school-outline
  state_content:
  - state
  - reason
- type: tile
  entity: binary_sensor.kitaplus_closed_tomorrow
  name: Kita tomorrow
  icon: mdi:school-outline
  state_content:
  - state
  - reason
