# KitaPlus dashboard (template)
type: vertical-stack
cards:
- type: heading
  heading: Mailbox
  heading_style: title
  icon: mdi:email-outline
- type: markdown
  content: |-
    {% set items = state_attr('sensor.kitaplus_mailbox', 'messages') or [] %}
    {% if items | length == 0 %}
    _No messages._
    {% else %}
    {% for p in items[:3] %}
    **{{ (p.titel or '–') | regex_replace('[*_`#>]', '') | trim }}**{% if p.datum %} · {{ p.datum[0:10] }}{% endif %}

    {% set text = (p.text or '') | regex_replace('[*_`#>]', '') | regex_replace('[\n\r\t ]+', ' ') | trim %}
    {% if text %}
    {{ text | truncate(110) }}

    {% endif %}
    {% endfor %}
    {% endif %}
