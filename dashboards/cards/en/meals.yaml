# KitaPlus dashboard (template) · version 0.3.5 · needs KitaPlus 0.3.1 or newer
type: markdown
content: |
  {%- set wd = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'] -%}
  {%- set mon = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'] -%}
  {%- macro clean(t) -%}
  {%- set s = (t or '') | regex_replace('[<>&"`*_#\\[\\]]', '') | regex_replace('[\n\r\t ]+', ' ') | trim -%}
  {%- for w in s.split(' ') -%}{{ w | truncate(24, True, '…') }}{{ ' ' if not loop.last }}{%- endfor -%}
  {%- endmacro -%}
  {%- macro dlabel(iso) -%}
  {%- set d = as_datetime(iso) -%}
  {%- if d -%}{{ wd[d.weekday()] }} {{ d.day ~ ' ' ~ mon[d.month - 1] }}{%- endif -%}
  {%- endmacro -%}

  {%- set words = {'ordered': 'Ordered', 'open': 'Open', 'missed': 'Deadline missed', 'not_offered': 'No meal', 'unavailable': 'Unavailable', 'unknown': 'Unknown'} -%}
  {%- set icons = {'ordered': '✓', 'open': '○', 'missed': '✕', 'not_offered': '–'} -%}
  ### <ha-icon icon="mdi:silverware-fork-knife"></ha-icon> Meals for KIND
  {% for ent, label in [('sensor.kind_order_status_today', 'Today'), ('sensor.kind_order_status_tomorrow', 'Tomorrow')] %}
  {%- set st = states(ent) -%}
  {%- set meal = clean(state_attr(ent, 'meal')) | trim -%}

  **{{ label }}** · {{ icons[st] if st in icons else '?' }} **{{ words[st] if st in words else st }}**
  {% if st != 'not_offered' and meal -%}
  {{ meal | truncate(80, True, '…') }}
  {% endif %}
  {% endfor %}
  {%- set dlstate = states('sensor.kind_next_order_deadline') -%}
  {%- if dlstate not in ['unknown', 'unavailable', 'none', ''] -%}
  {%- set dl = as_datetime(dlstate) | as_local -%}
  {%- set dayl = 'today' if dl.date() == now().date() else ('tomorrow' if (dl.date() - now().date()).days == 1 else wd[dl.weekday()] ~ ' ' ~ ('%02d' | format(dl.day)) ~ '.' ~ ('%02d' | format(dl.month)) ~ '.') %}

  <small>Next order deadline: <b>{{ dayl }}, {{ dl.strftime('%H:%M') }}</b></small>
  {%- endif -%}
