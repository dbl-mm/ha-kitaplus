# KitaPlus dashboard (template)
type: vertical-stack
cards:
- type: conditional
  conditions:
  - condition: state
    entity: binary_sensor.kind_nothing_ordered_tomorrow
    state: 'on'
  card:
    type: tile
    entity: binary_sensor.kind_nothing_ordered_tomorrow
    name: Order tomorrow's meal
    icon: mdi:silverware-fork-knife
    color: red
    state_content:
    - state
- type: conditional
  conditions:
  - condition: numeric_state
    entity: sensor.kitaplus_pending_replies
    above: 0
  card:
    type: vertical-stack
    cards:
    - type: tile
      entity: sensor.kitaplus_pending_replies
      name: Replies needed
      icon: mdi:email-alert-outline
      color: orange
    - type: markdown
      content: |-
        {% for m in state_attr('sensor.kitaplus_pending_replies', 'messages') or [] %}
        - **{{ m.titel }}**{% if m.frist %} · due {{ m.frist[5:10] }}{% endif %}
        {% endfor %}
- type: conditional
  conditions:
  - condition: state
    entity: binary_sensor.kind_nothing_ordered_tomorrow
    state_not: 'on'
  - condition: numeric_state
    entity: sensor.kitaplus_pending_replies
    below: 1
  card:
    type: markdown
    title: Nothing to do
    content: ✓ Everything is ordered, no reply is needed.
