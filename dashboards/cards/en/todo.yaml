# KitaPlus dashboard (template)
type: vertical-stack
cards:
- type: conditional
  conditions:
  - condition: state
    entity: sensor.kind_order_status_today
    state: open
  card:
    type: vertical-stack
    cards:
    - type: tile
      entity: sensor.kind_order_status_today
      name: Order today's meal while you can
      icon: mdi:cart-arrow-down
      color: red
      state_content:
      - meal
    - type: tile
      entity: sensor.kind_next_order_deadline
      name: Order deadline
      icon: mdi:timer-sand
      state_content:
      - state
- type: conditional
  conditions:
  - condition: state
    entity: sensor.kind_order_status_tomorrow
    state: open
  card:
    type: vertical-stack
    cards:
    - type: tile
      entity: sensor.kind_order_status_tomorrow
      name: Order tomorrow's meal
      icon: mdi:cart-arrow-down
      color: red
      state_content:
      - meal
    - type: tile
      entity: sensor.kind_next_order_deadline
      name: Order deadline
      icon: mdi:timer-sand
      state_content:
      - state
- type: conditional
  conditions:
  - condition: numeric_state
    entity: sensor.kitaplus_pending_replies
    above: 0
  card:
    type: vertical-stack
    cards:
    - type: tile
      entity: sensor.kitaplus_pending_replies
      name: Replies needed
      icon: mdi:email-alert-outline
      color: orange
    - type: markdown
      content: |-
        {% for m in state_attr('sensor.kitaplus_pending_replies', 'messages') or [] %}
        - **{{ (m.titel or '–') | regex_replace('[*_`#>]', '') | trim }}**{% if m.frist %} · due {{ m.frist[5:10] }}{% endif %}
        {% endfor %}
