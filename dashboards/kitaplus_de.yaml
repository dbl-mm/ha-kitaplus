# KitaPlus-Dashboard (Vorlage)
# Einbau: Einstellungen → Dashboards → Dashboard hinzufügen → öffnen → ⋮ → Raw-Konfigurationseditor.
# Ersetze KIND durch den Vornamen deines Kindes (Anzeige) und kind durch denselben Namen in Kleinbuchstaben
# (so heißen die Entities, siehe Einstellungen → Entitäten). Mehrere Kinder: README in diesem Ordner.
# Diese Datei wird erzeugt (scripts/build_dashboards.py), bitte nicht in der Vorlage selbst ändern.
title: Kita
views:
- title: Heute
  path: heute
  icon: mdi:home-heart
  type: sections
  sections:
  - type: grid
    cards:
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.kind_bestellstatus_heute
        state: open
      card:
        type: vertical-stack
        cards:
        - type: tile
          entity: sensor.kind_bestellstatus_heute
          name: Essen für heute noch bestellen
          icon: mdi:cart-arrow-down
          color: red
          state_content:
          - meal
        - type: tile
          entity: sensor.kind_nachste_bestellfrist
          name: Bestellfrist
          icon: mdi:timer-sand
          state_content:
          - state
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.kind_bestellstatus_morgen
        state: open
      card:
        type: vertical-stack
        cards:
        - type: tile
          entity: sensor.kind_bestellstatus_morgen
          name: Essen für morgen bestellen
          icon: mdi:cart-arrow-down
          color: red
          state_content:
          - meal
        - type: tile
          entity: sensor.kind_nachste_bestellfrist
          name: Bestellfrist
          icon: mdi:timer-sand
          state_content:
          - state
    - type: conditional
      conditions:
      - condition: numeric_state
        entity: sensor.kitaplus_offene_ruckmeldungen
        above: 0
      card:
        type: vertical-stack
        cards:
        - type: tile
          entity: sensor.kitaplus_offene_ruckmeldungen
          name: Rückmeldungen offen
          icon: mdi:email-alert-outline
          color: orange
        - type: markdown
          content: |-
            {% for m in state_attr('sensor.kitaplus_offene_ruckmeldungen', 'messages') or [] %}
            - **{{ (m.titel or '–') | regex_replace('[*_`#>]', '') | trim }}**{% if m.frist %} · bis {{ m.frist[8:10] }}.{{ m.frist[5:7] }}.{% endif %}
            {% endfor %}
  - type: grid
    cards:
    - type: heading
      heading: Kita
      heading_style: title
      icon: mdi:school-outline
    - type: tile
      entity: binary_sensor.kitaplus_heute_geschlossen
      name: Kita heute
      icon: mdi:school-outline
      color: orange
      state_content:
      - state
      - reason
    - type: tile
      entity: binary_sensor.kitaplus_morgen_geschlossen
      name: Kita morgen
      icon: mdi:school-outline
      color: orange
      state_content:
      - state
      - reason
  - type: grid
    cards:
    - type: heading
      heading: KIND
      heading_style: title
      icon: mdi:account-child-outline
    - type: tile
      entity: sensor.kind_bestellstatus_heute
      name: Heute
      icon: mdi:cart-outline
      state_content:
      - state
      - meal
    - type: tile
      entity: sensor.kind_bestellstatus_morgen
      name: Morgen
      icon: mdi:cart-outline
      state_content:
      - state
      - meal
  - type: grid
    cards:
    - type: heading
      heading: Konto
      heading_style: title
      icon: mdi:wallet-outline
    - type: tile
      entity: sensor.kitaplus_kontostand_verpflegung
      name: Guthaben
      icon: mdi:cash
      state_content:
      - state
- title: Mitteilungen
  path: mitteilungen
  icon: mdi:message-text-outline
  type: sections
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Schwarzes Brett
      heading_style: title
      icon: mdi:bulletin-board
    - type: markdown
      content: |-
        {% set items = state_attr('sensor.kitaplus_schwarzes_brett', 'posts') or [] %}
        {% if items | length == 0 %}
        _Keine Beiträge._
        {% else %}
        {% for p in items[:4] %}
        **{{ (p.titel or '–') | regex_replace('[*_`#>]', '') | trim }}**{% if p.datum %} · {{ p.datum[8:10] }}.{{ p.datum[5:7] }}.{{ p.datum[0:4] }}{% endif %}

        {% set text = (p.text or '') | regex_replace('[*_`#>]', '') | regex_replace('[\n\r\t ]+', ' ') | trim %}
        {% if text %}
        {{ text | truncate(110) }}

        {% endif %}
        {% endfor %}
        {% endif %}
  - type: grid
    cards:
    - type: heading
      heading: Postfach
      heading_style: title
      icon: mdi:email-outline
    - type: markdown
      content: |-
        {% set items = state_attr('sensor.kitaplus_postfach', 'messages') or [] %}
        {% if items | length == 0 %}
        _Keine Nachrichten._
        {% else %}
        {% for p in items[:3] %}
        **{{ (p.titel or '–') | regex_replace('[*_`#>]', '') | trim }}**{% if p.datum %} · {{ p.datum[8:10] }}.{{ p.datum[5:7] }}.{{ p.datum[0:4] }}{% endif %}

        {% set text = (p.text or '') | regex_replace('[*_`#>]', '') | regex_replace('[\n\r\t ]+', ' ') | trim %}
        {% if text %}
        {{ text | truncate(110) }}

        {% endif %}
        {% endfor %}
        {% endif %}
- title: Kalender
  path: kalender
  icon: mdi:calendar
  type: sections
  sections:
  - type: grid
    cards:
    - type: calendar
      entities:
      - calendar.kitaplus_termine
      - calendar.kitaplus_schliesstage
      - calendar.kind_bestelltes_essen
      initial_view: listWeek
