# KitaPlus-Dashboard (Vorlage) · Version 0.4.0 · benötigt KitaPlus ab 0.3.1
# Einbau: Einstellungen → Dashboards → Dashboard hinzufügen → öffnen → ⋮ → Raw-Konfigurationseditor.
# Ersetze KIND durch den Vornamen deines Kindes (Anzeige) und kind durch denselben Namen in Kleinbuchstaben
# (so heißen die Entities, siehe Einstellungen → Entitäten). Mehrere Kinder: README in diesem Ordner.
# Links zu angehängten Dateien (zum Beispiel Menüplan) brauchen KitaPlus ab 0.3.3, Gerichte aus dem Menüplan ab 0.4.0.
# Diese Datei wird erzeugt (scripts/build_dashboards.py), bitte nicht in der Vorlage selbst ändern.
title: Kita
views:
- title: Heute
  path: heute
  icon: mdi:home-heart
  type: sections
  max_columns: 1
  sections:
  - type: grid
    cards:
    - type: markdown
      content: |
        {%- set wd = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'] -%}
        {%- set mo = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'] -%}
        <small>{{ wd[now().weekday()] ~ ', ' ~ now().day ~ '. ' ~ mo[now().month - 1] }}</small>

        # KitaPlus
      text_only: true
    - type: markdown
      content: |
        {%- set wd = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'] -%}
        {%- macro clean(t) -%}
        {%- set s = (t or '') | regex_replace('[<>&"`*_#\\[\\]]', '') | regex_replace('[\n\r\t ]+', ' ') | trim -%}
        {%- for w in s.split(' ') -%}{{ w | truncate(24, True, '…') }}{{ ' ' if not loop.last }}{%- endfor -%}
        {%- endmacro -%}
        {%- macro dlabel(iso) -%}
        {%- set d = as_datetime(iso) -%}
        {%- set mon = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'] -%}
        {%- if d -%}{{ wd[d.weekday()] }} {{ '%02d' | format(d.day) ~ '.' ~ '%02d' | format(d.month) ~ '.' }}{%- endif -%}
        {%- endmacro -%}
        {%- set kids = [{'n': 'KIND', 't': 'sensor.kind_bestellstatus_heute', 'm': 'sensor.kind_bestellstatus_morgen', 'd': 'sensor.kind_nachste_bestellfrist'}] -%}
        {%- set ns = namespace(missed=[], opens=[], ordered=0, nodata=0) -%}
        {%- for k in kids -%}
        {%- for key, label in [('t', 'heute'), ('m', 'morgen')] -%}
        {%- set st = states(k[key]) -%}
        {%- if st == 'missed' -%}{%- set ns.missed = ns.missed + [k.n ~ ' ' ~ label] -%}{%- endif -%}
        {%- if st == 'open' -%}{%- set ns.opens = ns.opens + [{'n': k.n, 'label': label, 'dl': k.d}] -%}{%- endif -%}
        {%- if st == 'ordered' -%}{%- set ns.ordered = ns.ordered + 1 -%}{%- endif -%}
        {%- if st in ['unavailable', 'unknown'] -%}{%- set ns.nodata = ns.nodata + 1 -%}{%- endif -%}
        {%- endfor -%}
        {%- endfor -%}
        {%- set pending = 'sensor.kitaplus_offene_ruckmeldungen' -%}
        {%- set pend = states(pending) | int(0) -%}
        {%- set msgs = state_attr(pending, 'messages') or [] -%}
        {%- set title = clean(msgs[0].titel if msgs else '') | trim -%}
        {%- set total = ns.opens | count + pend -%}
        {%- if kids | selectattr('n', 'eq', 'KI' ~ 'ND') | list | count > 0 -%}
        <ha-alert alert-type="info" title="Noch nicht eingerichtet">Das ist erst die Vorlage, deshalb siehst du hier noch keine echten Daten. So richtest du sie ein:<br>1. Dashboard bearbeiten (Stift), dann ⋮ → Raw-Konfigurationseditor.<br>2. Mit Suchen und Ersetzen <b>{{ 'KI' ~ 'ND' }}</b> durch den Vornamen deines Kindes ersetzen, zum Beispiel Finn.<br>3. <b>{{ 'ki' ~ 'nd' }}</b> durch denselben Namen in Kleinbuchstaben ersetzen, zum Beispiel finn.<br>4. Speichern. Fertig.</ha-alert>
        {%- elif ns.missed | count > 0 -%}
        <ha-alert alert-type="warning" title="Nicht bestellt">{{ ('Essen für ' ~ ns.missed[0] ~ ' ist nicht bestellt.' if ns.missed | count == 1 else 'Nicht bestellt: ' ~ ns.missed | join(', ') ~ '.') | truncate(110, True, '…') }} Die Frist ist vorbei.</ha-alert>
        {%- elif total > 0 -%}
        {%- set first = ns.opens[0] if ns.opens else none -%}
        {%- set dlstate = states(first.dl) if first else 'unknown' -%}
        {%- set dl = (as_datetime(dlstate) | as_local) if dlstate not in ['unknown', 'unavailable', 'none', ''] else none -%}
        {%- set text = ('Essen für ' ~ first.n ~ ' ' ~ first.label ~ ' bestellen.' if first else 'Rückmeldung: ' ~ title) -%}
        {%- set pill = '' -%}
        {%- if dl and dl > now() -%}
        {%- set mins = ((dl - now()).total_seconds() // 60) | int -%}
        {%- set left = ((mins // 60) ~ ' Std.' ~ (' ' ~ (mins % 60) ~ ' Min.' if mins % 60 else '')) if mins >= 60 else (mins ~ ' Min.') -%}
        {%- set dayl = 'heute' if dl.date() == now().date() else ('morgen' if (dl.date() - now().date()).days == 1 else wd[dl.weekday()]) -%}
        {%- set pill = 'Frist ' ~ dayl ~ ', ' ~ dl.strftime('%H:%M') ~ ' · noch ' ~ left -%}
        {%- elif not first and msgs and msgs[0].frist -%}
        {%- set pill = 'Antwort bis ' ~ dlabel(msgs[0].frist) -%}
        {%- endif -%}
        <ha-alert alert-type="warning" title="{{ 'Eine Sache ist offen' if total == 1 else total ~ ' Sachen sind offen' }}">{{ text | truncate(110, True, '…') }}{{ ' Dazu ' ~ (total - 1) ~ ' weitere.' if total > 1 else '' }}{% if pill %}<br><b>{{ pill }}</b>{% endif %}</ha-alert>
        {%- elif is_state('binary_sensor.kitaplus_heute_geschlossen', 'on') -%}
        {%- set reason = clean(state_attr('binary_sensor.kitaplus_heute_geschlossen', 'reason')) | trim -%}
        ### <ha-icon icon="mdi:calendar-remove"></ha-icon> Kita heute geschlossen

        {{ reason ~ '. ' if reason else '' }}{{ 'Morgen ist ebenfalls geschlossen.' if is_state('binary_sensor.kitaplus_morgen_geschlossen', 'on') else 'Morgen ist wieder geöffnet.' }}
        {%- elif ns.nodata > 0 or states(pending) in ['unavailable', 'unknown'] -%}
        <ha-alert alert-type="warning" title="Keine aktuellen Daten">KitaPlus ist gerade nicht erreichbar, oder die Entitäten des Kindes fehlen (Namen prüfen unter Einstellungen → Entitäten).</ha-alert>
        {%- else -%}
        <ha-alert alert-type="info" title="Heute ist nichts zu tun">{{ 'Essen für heute und morgen ist bestellt. Keine Rückmeldung offen.' if ns.ordered > 0 else 'Es gibt nichts zu bestellen. Keine Rückmeldung offen.' }}</ha-alert>
        {%- endif -%}
      text_only: true
    - type: tile
      entity: binary_sensor.kitaplus_heute_geschlossen
      name: Kita heute
      icon: mdi:school-outline
      state_content:
      - state
      - reason
    - type: tile
      entity: binary_sensor.kitaplus_morgen_geschlossen
      name: Kita morgen
      icon: mdi:school-outline
      state_content:
      - state
      - reason
  - type: grid
    cards:
    - type: markdown
      content: |
        {%- set wd = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'] -%}
        {%- set mon = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'] -%}
        {%- macro clean(t) -%}
        {%- set s = (t or '') | regex_replace('[<>&"`*_#\\[\\]]', '') | regex_replace('[\n\r\t ]+', ' ') | trim -%}
        {%- for w in s.split(' ') -%}{{ w | truncate(24, True, '…') }}{{ ' ' if not loop.last }}{%- endfor -%}
        {%- endmacro -%}
        {%- macro dlabel(iso) -%}
        {%- set d = as_datetime(iso) -%}
        {%- if d -%}{{ wd[d.weekday()] }} {{ '%02d' | format(d.day) ~ '.' ~ '%02d' | format(d.month) ~ '.' }}{%- endif -%}
        {%- endmacro -%}

        {%- set words = {'ordered': 'Bestellt', 'open': 'Offen', 'missed': 'Frist verpasst', 'not_offered': 'Kein Essen', 'unavailable': 'Nicht verfügbar', 'unknown': 'Unbekannt'} -%}
        {%- set icons = {'ordered': '✓', 'open': '○', 'missed': '✕', 'not_offered': '–'} -%}
        ### <ha-icon icon="mdi:silverware-fork-knife"></ha-icon> Essen für KIND
        {% if 'KIND' == 'KI' ~ 'ND' -%}
        Noch keine Daten. Richte zuerst die Vorlage ein, die Anleitung steht oben.
        {%- else -%}
        {%- set ns = namespace(from_plan=false) -%}
        {% for ent, label, dish_ent in [('sensor.kind_bestellstatus_heute', 'Heute', 'sensor.kitaplus_speiseplan_heute'), ('sensor.kind_bestellstatus_morgen', 'Morgen', 'sensor.kitaplus_speiseplan_morgen')] %}
        {%- set st = states(ent) -%}
        {%- set dish = clean(states(dish_ent)) | trim if states(dish_ent) not in ['unknown', 'unavailable', 'none', ''] else '' -%}
        {%- set meal = dish or (clean(state_attr(ent, 'meal')) | trim) -%}
        {%- set ns.from_plan = ns.from_plan or (dish != '' and st != 'not_offered') -%}

        **{{ label }}** · {{ icons[st] if st in icons else '?' }} **{{ words[st] if st in words else st }}**
        {% if st != 'not_offered' and meal -%}
        {{ meal | truncate(80, True, '…') }}{{ ' · vegetarisch' if dish and is_state_attr(dish_ent, 'vegetarian', true) else '' }}{{ ' · bitte im Menüplan prüfen' if dish and is_state_attr(dish_ent, 'uncertain', true) else '' }}
        {% endif %}
        {% endfor %}
        {%- if ns.from_plan %}
        <small>Gericht laut Menüplan-PDF, ohne Gewähr.</small>
        {% endif %}
        {%- set dlstate = states('sensor.kind_nachste_bestellfrist') -%}
        {%- if dlstate not in ['unknown', 'unavailable', 'none', ''] -%}
        {%- set dl = as_datetime(dlstate) | as_local -%}
        {%- set dayl = 'heute' if dl.date() == now().date() else ('morgen' if (dl.date() - now().date()).days == 1 else wd[dl.weekday()] ~ ' ' ~ ('%02d' | format(dl.day)) ~ '.' ~ ('%02d' | format(dl.month)) ~ '.') %}

        <small>Nächste Bestellfrist: <b>{{ dayl }}, {{ dl.strftime('%H:%M') }}</b></small>
        {%- endif -%}
        {%- endif -%}
  - type: grid
    cards:
    - type: markdown
      content: |
        {%- set wd = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'] -%}
        {%- set mon = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'] -%}
