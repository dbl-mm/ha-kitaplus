        Attachment: {% for f in files %}{% set label = clean(f.name) | trim | truncate(80, True, '…') %}{% if f.url and f.url.startswith('/api/kitaplus/') %}<a href="{{ f.url }}" target="_blank" rel="noopener">{{ label }}</a>{% else %}{{ label }}{% endif %}{{ ', ' if not loop.last }}{% endfor %}
        {% endif -%}
        {%- endif -%}
