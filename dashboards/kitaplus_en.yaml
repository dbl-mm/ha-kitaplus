# KitaPlus dashboard (template) · version 0.3.6 · needs KitaPlus 0.3.1 or newer
# Install: Settings → Dashboards → Add dashboard → open it → ⋮ → Raw configuration editor.
# Replace KIND with your child's first name (display) and kind with the same name in lower case
# (that is how the entities are named, see Settings → Entities). Several children: see the README here.
# Links to attached files (for example the meal plan) need KitaPlus 0.3.3 or newer.
# This file is generated (scripts/build_dashboards.py), please do not edit the template itself.
title: Kita
views:
- title: Today
  path: heute
  icon: mdi:home-heart
  type: sections
  max_columns: 1
  sections:
  - type: grid
    cards:
    - type: markdown
      content: |
        {%- set wd = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'] -%}
        {%- set mo = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'] -%}
        <small>{{ wd[now().weekday()] ~ ', ' ~ now().day ~ ' ' ~ mo[now().month - 1] }}</small>

        # KitaPlus
      text_only: true
    - type: markdown
      content: |
        {%- set wd = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'] -%}
        {%- macro clean(t) -%}
        {%- set s = (t or '') | regex_replace('[<>&"`*_#\\[\\]]', '') | regex_replace('[\n\r\t ]+', ' ') | trim -%}
        {%- for w in s.split(' ') -%}{{ w | truncate(24, True, '…') }}{{ ' ' if not loop.last }}{%- endfor -%}
        {%- endmacro -%}
        {%- macro dlabel(iso) -%}
        {%- set d = as_datetime(iso) -%}
        {%- set mon = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'] -%}
        {%- if d -%}{{ wd[d.weekday()] }} {{ d.day ~ ' ' ~ mon[d.month - 1] }}{%- endif -%}
        {%- endmacro -%}
        {%- set kids = [{'n': 'KIND', 't': 'sensor.kind_order_status_today', 'm': 'sensor.kind_order_status_tomorrow', 'd': 'sensor.kind_next_order_deadline'}] -%}
        {%- set ns = namespace(missed=[], opens=[], ordered=0, nodata=0) -%}
        {%- for k in kids -%}
        {%- for key, label in [('t', 'today'), ('m', 'tomorrow')] -%}
        {%- set st = states(k[key]) -%}
        {%- if st == 'missed' -%}{%- set ns.missed = ns.missed + [k.n ~ ' ' ~ label] -%}{%- endif -%}
        {%- if st == 'open' -%}{%- set ns.opens = ns.opens + [{'n': k.n, 'label': label, 'dl': k.d}] -%}{%- endif -%}
        {%- if st == 'ordered' -%}{%- set ns.ordered = ns.ordered + 1 -%}{%- endif -%}
        {%- if st in ['unavailable', 'unknown'] -%}{%- set ns.nodata = ns.nodata + 1 -%}{%- endif -%}
        {%- endfor -%}
        {%- endfor -%}
        {%- set pending = 'sensor.kitaplus_pending_replies' -%}
        {%- set pend = states(pending) | int(0) -%}
        {%- set msgs = state_attr(pending, 'messages') or [] -%}
        {%- set title = clean(msgs[0].titel if msgs else '') | trim -%}
        {%- set total = ns.opens | count + pend -%}
        {%- if kids | selectattr('n', 'eq', 'KI' ~ 'ND') | list | count > 0 -%}
        <ha-alert alert-type="info" title="Not set up yet">This is only the template, so there is no real data here yet. To set it up:<br>1. Edit the dashboard (pencil), then ⋮ → Raw configuration editor.<br>2. With find and replace, change <b>{{ 'KI' ~ 'ND' }}</b> to your child's first name, for example Finn.<br>3. Change <b>{{ 'ki' ~ 'nd' }}</b> to the same name in lower case, for example finn.<br>4. Save. Done.</ha-alert>
        {%- elif ns.missed | count > 0 -%}
        <ha-alert alert-type="warning" title="Not ordered">{{ ('The meal for ' ~ ns.missed[0] ~ ' is not ordered.' if ns.missed | count == 1 else 'Not ordered: ' ~ ns.missed | join(', ') ~ '.') | truncate(110, True, '…') }} The deadline has passed.</ha-alert>
        {%- elif total > 0 -%}
        {%- set first = ns.opens[0] if ns.opens else none -%}
        {%- set dlstate = states(first.dl) if first else 'unknown' -%}
        {%- set dl = (as_datetime(dlstate) | as_local) if dlstate not in ['unknown', 'unavailable', 'none', ''] else none -%}
        {%- set text = ('Order the meal for ' ~ first.n ~ ' ' ~ first.label ~ '.' if first else 'Reply needed: ' ~ title) -%}
        {%- set pill = '' -%}
        {%- if dl and dl > now() -%}
        {%- set mins = ((dl - now()).total_seconds() // 60) | int -%}
        {%- set left = ((mins // 60) ~ ' h' ~ (' ' ~ (mins % 60) ~ ' min' if mins % 60 else '')) if mins >= 60 else (mins ~ ' min') -%}
        {%- set dayl = 'today' if dl.date() == now().date() else ('tomorrow' if (dl.date() - now().date()).days == 1 else wd[dl.weekday()]) -%}
        {%- set pill = 'Deadline ' ~ dayl ~ ', ' ~ dl.strftime('%H:%M') ~ ' · ' ~ left ~ ' left' -%}
        {%- elif not first and msgs and msgs[0].frist -%}
        {%- set pill = 'Reply by ' ~ dlabel(msgs[0].frist) -%}
        {%- endif -%}
        <ha-alert alert-type="warning" title="{{ 'One thing is open' if total == 1 else total ~ ' things are open' }}">{{ text | truncate(110, True, '…') }}{{ ' Plus ' ~ (total - 1) ~ ' more.' if total > 1 else '' }}{% if pill %}<br><b>{{ pill }}</b>{% endif %}</ha-alert>
        {%- elif is_state('binary_sensor.kitaplus_closed_today', 'on') -%}
        {%- set reason = clean(state_attr('binary_sensor.kitaplus_closed_today', 'reason')) | trim -%}
        ### <ha-icon icon="mdi:calendar-remove"></ha-icon> Kita closed today

        {{ reason ~ '. ' if reason else '' }}{{ 'Tomorrow it is closed as well.' if is_state('binary_sensor.kitaplus_closed_tomorrow', 'on') else 'Tomorrow it is open again.' }}
        {%- elif ns.nodata > 0 or states(pending) in ['unavailable', 'unknown'] -%}
        <ha-alert alert-type="warning" title="No current data">KitaPlus cannot be reached right now, or the child's entities are missing (check the names under Settings → Entities).</ha-alert>
        {%- else -%}
        <ha-alert alert-type="info" title="Nothing to do today">{{ 'Meals for today and tomorrow are ordered. No reply needed.' if ns.ordered > 0 else 'There is nothing to order. No reply needed.' }}</ha-alert>
        {%- endif -%}
      text_only: true
    - type: tile
      entity: binary_sensor.kitaplus_closed_today
      name: Kita today
      icon: mdi:school-outline
      state_content:
      - state
      - reason
    - type: tile
      entity: binary_sensor.kitaplus_closed_tomorrow
      name: Kita tomorrow
      icon: mdi:school-outline
      state_content:
      - state
      - reason
  - type: grid
    cards:
    - type: markdown
      content: |
        {%- set wd = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'] -%}
        {%- set mon = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'] -%}
        {%- macro clean(t) -%}
        {%- set s = (t or '') | regex_replace('[<>&"`*_#\\[\\]]', '') | regex_replace('[\n\r\t ]+', ' ') | trim -%}
        {%- for w in s.split(' ') -%}{{ w | truncate(24, True, '…') }}{{ ' ' if not loop.last }}{%- endfor -%}
        {%- endmacro -%}
        {%- macro dlabel(iso) -%}
        {%- set d = as_datetime(iso) -%}
        {%- if d -%}{{ wd[d.weekday()] }} {{ d.day ~ ' ' ~ mon[d.month - 1] }}{%- endif -%}
        {%- endmacro -%}

        {%- set words = {'ordered': 'Ordered', 'open': 'Open', 'missed': 'Deadline missed', 'not_offered': 'No meal', 'unavailable': 'Unavailable', 'unknown': 'Unknown'} -%}
        {%- set icons = {'ordered': '✓', 'open': '○', 'missed': '✕', 'not_offered': '–'} -%}
        ### <ha-icon icon="mdi:silverware-fork-knife"></ha-icon> Meals for KIND
        {% if 'KIND' == 'KI' ~ 'ND' -%}
        No data yet. Set up the template first, the instructions are at the top.
        {%- else -%}
        {% for ent, label in [('sensor.kind_order_status_today', 'Today'), ('sensor.kind_order_status_tomorrow', 'Tomorrow')] %}
        {%- set st = states(ent) -%}
        {%- set meal = clean(state_attr(ent, 'meal')) | trim -%}

        **{{ label }}** · {{ icons[st] if st in icons else '?' }} **{{ words[st] if st in words else st }}**
        {% if st != 'not_offered' and meal -%}
        {{ meal | truncate(80, True, '…') }}
        {% endif %}
        {% endfor %}
        {%- set dlstate = states('sensor.kind_next_order_deadline') -%}
        {%- if dlstate not in ['unknown', 'unavailable', 'none', ''] -%}
        {%- set dl = as_datetime(dlstate) | as_local -%}
        {%- set dayl = 'today' if dl.date() == now().date() else ('tomorrow' if (dl.date() - now().date()).days == 1 else wd[dl.weekday()] ~ ' ' ~ ('%02d' | format(dl.day)) ~ '.' ~ ('%02d' | format(dl.month)) ~ '.') %}

        <small>Next order deadline: <b>{{ dayl }}, {{ dl.strftime('%H:%M') }}</b></small>
        {%- endif -%}
        {%- endif -%}
