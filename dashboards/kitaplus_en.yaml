        {%- set s = (t or '') | regex_replace('[<>&"`*_#\\[\\]]', '') | regex_replace('[\n\r\t ]+', ' ') | trim -%}
        {%- for w in s.split(' ') -%}{{ w | truncate(24, True, '…') }}{{ ' ' if not loop.last }}{%- endfor -%}
        {%- endmacro -%}
        {%- macro dlabel(iso) -%}
        {%- set d = as_datetime(iso) -%}
        {%- if d -%}{{ wd[d.weekday()] }} {{ d.day ~ ' ' ~ mon[d.month - 1] }}{%- endif -%}
        {%- endmacro -%}

        ### <ha-icon icon="mdi:bulletin-board"></ha-icon> Bulletin board
        {% set posts = state_attr('sensor.kitaplus_bulletin_board', 'posts') or [] -%}
        {% if posts | count == 0 -%}
        No post on the bulletin board.
        {%- else -%}
        {%- set p = posts[0] -%}
        {%- set head = clean(p.titel) | trim -%}

        **{{ (head if head else 'Untitled') | truncate(80, True, '…') }}**
        {% if p.datum %}
        {{ dlabel(p.datum) }}
        {% endif -%}
        {%- set files = (p.attachments or [])[:2] -%}
