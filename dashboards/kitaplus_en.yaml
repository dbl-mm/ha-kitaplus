# KitaPlus dashboard (template)
# Install: Settings → Dashboards → Add dashboard → open it → ⋮ → Raw configuration editor.
# Replace KIND with your child's first name (display) and kind with the same name in lower case
# (that is how the entities are named, see Settings → Entities). Several children: see the README here.
# This file is generated (scripts/build_dashboards.py), please do not edit the template itself.
title: Kita
views:
- title: Today
  path: heute
  icon: mdi:home-heart
  type: sections
  sections:
  - type: grid
    cards:
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.kind_order_status_today
        state: open
      card:
        type: vertical-stack
        cards:
        - type: tile
          entity: sensor.kind_order_status_today
          name: Order today's meal while you can
          icon: mdi:cart-arrow-down
          color: red
          state_content:
          - meal
        - type: tile
          entity: sensor.kind_next_order_deadline
          name: Order deadline
          icon: mdi:timer-sand
          state_content:
          - state
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.kind_order_status_tomorrow
        state: open
      card:
        type: vertical-stack
        cards:
        - type: tile
          entity: sensor.kind_order_status_tomorrow
          name: Order tomorrow's meal
          icon: mdi:cart-arrow-down
          color: red
          state_content:
          - meal
        - type: tile
          entity: sensor.kind_next_order_deadline
          name: Order deadline
          icon: mdi:timer-sand
          state_content:
          - state
    - type: conditional
      conditions:
      - condition: numeric_state
        entity: sensor.kitaplus_pending_replies
        above: 0
      card:
        type: vertical-stack
        cards:
        - type: tile
          entity: sensor.kitaplus_pending_replies
          name: Replies needed
          icon: mdi:email-alert-outline
          color: orange
        - type: markdown
          content: |-
            {% for m in state_attr('sensor.kitaplus_pending_replies', 'messages') or [] %}
            - **{{ (m.titel or '–') | regex_replace('[*_`#>]', '') | trim }}**{% if m.frist %} · due {{ m.frist[5:10] }}{% endif %}
            {% endfor %}
  - type: grid
    cards:
    - type: heading
      heading: Kita
      heading_style: title
      icon: mdi:school-outline
    - type: tile
      entity: binary_sensor.kitaplus_closed_today
      name: Kita today
      icon: mdi:school-outline
      color: orange
      state_content:
      - state
      - reason
    - type: tile
      entity: binary_sensor.kitaplus_closed_tomorrow
      name: Kita tomorrow
      icon: mdi:school-outline
      color: orange
      state_content:
      - state
      - reason
  - type: grid
    cards:
    - type: heading
      heading: KIND
      heading_style: title
      icon: mdi:account-child-outline
    - type: tile
      entity: sensor.kind_order_status_today
      name: Today
      icon: mdi:cart-outline
      state_content:
      - state
      - meal
    - type: tile
      entity: sensor.kind_order_status_tomorrow
      name: Tomorrow
      icon: mdi:cart-outline
      state_content:
      - state
      - meal
  - type: grid
    cards:
    - type: heading
      heading: Account
      heading_style: title
      icon: mdi:wallet-outline
    - type: tile
      entity: sensor.kitaplus_meal_account_balance
      name: Balance
      icon: mdi:cash
      state_content:
      - state
- title: Messages
  path: mitteilungen
  icon: mdi:message-text-outline
  type: sections
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Bulletin board
      heading_style: title
      icon: mdi:bulletin-board
    - type: markdown
      content: |-
        {% set items = state_attr('sensor.kitaplus_bulletin_board', 'posts') or [] %}
        {% if items | length == 0 %}
        _No posts._
        {% else %}
        {% for p in items[:4] %}
        **{{ (p.titel or '–') | regex_replace('[*_`#>]', '') | trim }}**{% if p.datum %} · {{ p.datum[0:10] }}{% endif %}

        {% set text = (p.text or '') | regex_replace('[*_`#>]', '') | regex_replace('[\n\r\t ]+', ' ') | trim %}
        {% if text %}
        {{ text | truncate(110) }}

        {% endif %}
        {% endfor %}
        {% endif %}
  - type: grid
    cards:
    - type: heading
      heading: Mailbox
      heading_style: title
      icon: mdi:email-outline
    - type: markdown
      content: |-
        {% set items = state_attr('sensor.kitaplus_mailbox', 'messages') or [] %}
        {% if items | length == 0 %}
        _No messages._
        {% else %}
        {% for p in items[:3] %}
        **{{ (p.titel or '–') | regex_replace('[*_`#>]', '') | trim }}**{% if p.datum %} · {{ p.datum[0:10] }}{% endif %}

        {% set text = (p.text or '') | regex_replace('[*_`#>]', '') | regex_replace('[\n\r\t ]+', ' ') | trim %}
        {% if text %}
        {{ text | truncate(110) }}

        {% endif %}
        {% endfor %}
        {% endif %}
- title: Calendar
  path: kalender
  icon: mdi:calendar
  type: sections
  sections:
  - type: grid
    cards:
    - type: calendar
      entities:
      - calendar.kitaplus_appointments
      - calendar.kitaplus_closures
      - calendar.kind_ordered_meals
      initial_view: listWeek
