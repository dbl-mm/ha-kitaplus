[project]
name = "ha-kitaplus"
version = "0.1.0"
requires-python = ">=3.13"

[dependency-groups]
dev = ["pytest-homeassistant-custom-component", "aioresponses", "ruff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
