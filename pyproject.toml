[project]
name = "ha-kitaplus"
version = "0.1.0"
requires-python = ">=3.13"

[dependency-groups]
dev = ["pytest-homeassistant-custom-component", "aioresponses", "pytest-cov", "mypy", "ruff", "pillow"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["real_client: use the real client methods with mocked HTTP"]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# a generator full of long user-facing text lines
"scripts/build_dashboards.py" = ["E501"]
"custom_components/kitaplus/dashboard.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
files = ["custom_components/kitaplus"]

[[tool.mypy.overrides]]
# PyYAML ships no type information; the dashboard generator subclasses its dumper
module = ["yaml", "kitaplus.dashboard", "custom_components.kitaplus.dashboard"]
ignore_missing_imports = true
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
